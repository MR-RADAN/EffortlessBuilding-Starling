name: Package Starling native mod

on:
  push:
    branches: [main]
    paths:
      - "native/effortless-building-v0.1.0/**"
      - "scripts/package_native.py"
      - ".github/workflows/package-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build and validate .hnmod
        run: python3 scripts/package_native.py
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: effortless_building-0.1.0-hnmod
          path: dist/effortless_building-0.1.0.hnmod
          if-no-files-found: error
          retention-days: 30
