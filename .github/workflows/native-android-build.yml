name: Compile native mod against Starling 0.9.0

on:
  workflow_dispatch:
  push:
    branches: [main, migration/native-sdk-0.2]
    paths:
      - "native/effortless-building-v0.1.0/**"
      - ".github/workflows/native-android-build.yml"

concurrency:
  group: native-android-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out Effortless Building
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out the exact Starling 0.9.0 source
        uses: actions/checkout@v4
        with:
          repository: starling-client/starling
          ref: v0.9.0
          path: starling-source
          persist-credentials: false

      - name: Verify source revision
        run: |
          actual="$(git -C starling-source rev-parse HEAD)"
          expected="ff303502a4f7982551a0e0d3622d9268efe9e829"
          test "$actual" = "$expected"
          echo "Building against Starling 0.9.0 at $actual"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Starling's pinned Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "build-tools;35.0.0" "platforms;android-36" "ndk;28.2.13676358" > /dev/null

      - name: Install Rust for Android and cargo-ndk
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-linux-android
          rustup default stable
          rustup component add rust-src
          cargo install cargo-ndk --version 3.5.4 --locked

      - name: Make room for the native release build
        run: |
          sudo swapoff -a || true
          where=/mnt
          size=20G
          avail=$(df --output=avail -BG "$where" 2>/dev/null | tail -1 | tr -dc 0-9)
          if [ "${avail:-0}" -lt 30 ]; then where=$RUNNER_TEMP; size=10G; fi
          sudo fallocate -l "$size" "$where/effortless-release.swap"
          sudo chmod 600 "$where/effortless-release.swap"
          sudo mkswap "$where/effortless-release.swap" > /dev/null
          sudo swapon "$where/effortless-release.swap"
          echo "CARGO_BUILD_JOBS=3" >> "$GITHUB_ENV"
          echo "NATIVE_CACHE=$RUNNER_TEMP/starling-native-cache" >> "$GITHUB_ENV"

      - name: Report pinned native build inputs
        run: |
          echo "Project native bundle: 0.1.0"
          echo "Starling target: 0.9.0 / ff303502a4f7982551a0e0d3622d9268efe9e829"
          echo "Rust source component: installed"

      - name: Compile the native mod into Starling's Android ARM64 library
        env:
          ABI: arm64-v8a
          PROFILE: fast
          NATIVE_LIBRARY_ONLY: "1"
        run: |
          bash starling-source/packaging/android/native_build.sh \
            starling-source \
            out \
            "$GITHUB_WORKSPACE/native/effortless-building-v0.1.0"

      - name: Upload compiled ARM64 library and build manifest
        uses: actions/upload-artifact@v4
        with:
          name: effortless-building-starling-0.9.0-arm64
          path: |
            out/libhorizon_android.so
            out/build.json
          if-no-files-found: error
          retention-days: 7
